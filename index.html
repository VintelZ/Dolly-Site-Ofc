["Pudim de Leite",[["Ingrediente","Leite condensado e ovos","Água e sal","Farinha e cebola"],["Forno","Banho-maria, 180°C","600°C","Geladeira"],["Ovos","3 ovos","30 ovos","Nenhum"],["Finalização","Gelar e desenformar","Servir fervendo","Fritar"]]]
];
const KEY="dollywonka_v1";
let S={lvl:0,turn:0,done:0};
try{S=Object.assign(S,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
let cur=null,step=0,hist=[],bag=[];
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function ui(){$("lvl").textContent=S.lvl;$("bar").style.width=S.lvl/10+"%";
  $("start").style.display=cur?"none":"inline-block";
  $("start").textContent=S.turn?"Próximo Turno":"Começar Turno"}
const no=()=>"No."+(100000+S.turn*37+step*5+S.done*91);
function start(){
  if(!bag.length)bag=shuf(CANDIES.map((_,i)=>i)); // sorteia todos antes de repetir
  cur=CANDIES[bag.pop()];step=0;S.turn++;save();hist=[];ui();render()}
function render(msg){
  const [name,steps]=cur;
  let h=`<div class="post"><div class="meta"><span class="name">Anônimo</span> ${no()}</div>
  <div class="turn">Turno #${S.turn}</div><div class="msg"><b>${esc(name)}</b></div>`;
  hist.forEach(x=>h+=`<div class="green">&gt;${esc(x)}</div>`);
  if(step<steps.length){
    const s=steps[step];
    h+=`<div class="msg">${esc(s[0])} (${step+1}/${steps.length}):</div>`;
    if(msg)h+=`<div class="err">${msg}</div>`;
    h+=`<div class="opts">`;
    shuf([0,1,2]).forEach(k=>h+=`<button class="bt" data-k="${k}">${esc(s[k+1])}</button>`);
    h+=`</div>`;
  }else h+=`<div class="ok">${esc(name)} pronto! +5 níveis.</div>`;
  $("stage").innerHTML=h+`</div>`;
}
$("stage").addEventListener("click",e=>{
  const b=e.target.closest("[data-k]");if(!b||!cur)return;
  const s=cur[1][step];
  if(+b.dataset.k===0){
    hist.push(s[0]+": "+s[1]);step++;
    if(step>=cur[1].length){S.lvl=Math.min(1000,S.lvl+5);S.done++;save();render();cur=null;ui();return}
    render();
  }else render("Errado! Tenta de novo.");
});
$("start").onclick=start;
$("reset").onclick=e=>{e.preventDefault();if(confirm("Apagar todo o progresso?")){S={lvl:0,turn:0,done:0};save();cur=null;$("stage").innerHTML="";ui()}};
ui();
</script>
</body>
</html>
